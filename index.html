<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="iwar-api-base-url" content="https://infinit-war-api.onrender.com">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:4000 https://infinit-war-api.onrender.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.facebook.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://www.facebook.com;">
<title>Infinit War (Guerra Infinita) — Teste sem login</title>
<link rel="stylesheet" href="style.css">
<style>
/* TEST ONLY: keep the login code intact but hide its panel for gameplay checks. */
.auth-box { display: none !important; }
</style>
</head>
<body class="menu">
<main class="menu-container">
    <h1>Infinit War</h1>
    <p class="subtitle">Modo de teste — entrada temporariamente sem conta.</p>

    <label class="field-label" for="nickname">Nickname</label>
    <input type="text" id="nickname" placeholder="Digite seu nickname" maxlength="16" autocomplete="off">

    <h2>Escolha seu elemento</h2>
    <div class="elements" role="group" aria-label="Seleção de elemento">
        <button type="button" class="element-btn is-selected" data-element="fire">Fogo</button>
        <button type="button" class="element-btn" data-element="water">Água</button>
        <button type="button" class="element-btn" data-element="earth">Terra</button>
    </div>

    <button type="button" id="startGameBtn" class="start-btn">Entrar na Arena</button>
</main>

<script src="api/config.js" defer></script>
<script src="api/client.js" defer></script>
<script src="main.js" defer></script>
</body>
</html>
