name: Drop Probability Calibration

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
    paths:
      - ".github/workflows/drop-probability-calibration.yml"
      - "tests/art-asset-manifest.test.mjs"
      - "tests/drop-probability-simulation.test.mjs"
      - "scripts/validate-art-assets.mjs"
      - "assets/**"
      - "art/**"
      - "data/**"
  pull_request:
    paths:
      - ".github/workflows/drop-probability-calibration.yml"
      - "tests/art-asset-manifest.test.mjs"
      - "tests/drop-probability-simulation.test.mjs"
      - "scripts/validate-art-assets.mjs"
      - "assets/**"
      - "art/**"
      - "data/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # Keep active checks running; only superseded pending runs are coalesced.
  cancel-in-progress: false

jobs:
  probability-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate original art manifest and intake
        run: |
          node --test tests/art-asset-manifest.test.mjs
          node scripts/validate-art-assets.mjs

      - name: Run deterministic Monte Carlo calibration
        run: node --test tests/drop-probability-simulation.test.mjs
