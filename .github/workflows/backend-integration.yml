name: Backend Integration

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-integration.yml"
      - ".github/workflows/backend-tests.yml"
      - "api/**"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-integration.yml"
      - "api/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # Keep running tests alive; GitHub replaces only older pending runs in this group.
  cancel-in-progress: false

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: infinitwar_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d infinitwar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend integration tests
        run: npm run test:integration
        working-directory: backend

      - name: Exercise real PostgreSQL repository reads and advisory-lock concurrency
        run: npm run test:postgres-lock
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/infinitwar_test
