name: Backend Integration

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-integration.yml"
      - ".github/workflows/backend-tests.yml"
      - "api/**"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-integration.yml"
      - "api/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # Keep running tests alive; GitHub replaces only older pending runs in this group.
  cancel-in-progress: false

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: infinitwar_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d infinitwar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Initialize repository against real PostgreSQL
        run: npm run migrate:postgres
        working-directory: backend
        env:
          NODE_ENV: test
          DATA_DRIVER: postgres
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_DATABASE: infinitwar_test
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_SSL: "false"

      - name: Verify PostgreSQL schema and JSONB operations
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import pg from "pg";
          const client = new pg.Client({
            host: process.env.PG_HOST,
            port: Number(process.env.PG_PORT),
            database: process.env.PG_DATABASE,
            user: process.env.PG_USER,
            password: process.env.PG_PASSWORD,
            ssl: false
          });
          await client.connect();
          try {
            const tables = await client.query(
              "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_name = ANY($1::text[]) ORDER BY table_name",
              [["app_state", "users", "heroes", "buildings", "inventory", "receipts", "alliances"]]
            );
            assert.equal(tables.rows.length, 7, "Expected all seven repository tables");
            const state = await client.query("SELECT payload FROM app_state WHERE id = 1");
            assert.equal(state.rows.length, 1, "Expected initialized app_state row");
            assert.equal(typeof state.rows[0].payload, "object", "Expected JSONB payload to decode as an object");
            console.log("PostgreSQL connection, seven tables, and JSONB app_state verified.");
          } finally {
            await client.end();
          }
          NODE
        working-directory: backend
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_DATABASE: infinitwar_test
          PG_USER: postgres
          PG_PASSWORD: postgres

      - name: Verify player state survives normalized PostgreSQL reads
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { env } from "./src/config/env.js";
          import { closeRepository, initializeRepository, readDb, writeDb } from "./src/repositories/dbRepository.js";
          env.DATA_DRIVER = "postgres";
          env.NODE_ENV = "test";
          await initializeRepository(env);
          try {
            const externalId = "guest:postgres_state_roundtrip";
            const state = {
              users: {
                [externalId]: {
                  profile: { provider: "guest", providerUid: "postgres_state_roundtrip", email: "", displayName: "Roundtrip" },
                  state: null,
                  economy: { gems: 100 },
                  inventory: { potion_small: 3 },
                  createdAt: 1000,
                  updatedAt: 2000,
                  v1: {
                    stateVersion: 1,
                    level: 7,
                    power: 1200,
                    vipLevel: 0,
                    resources: { gold: 123, wood: 45, steel: 67, food: 89, gems: 100, energy: 72, energyMax: 100, energyRegenPerMinute: 1.2 },
                    heroes: [{ heroId: "lucas", rarity: "LEGENDARY", level: 4, stars: 2, ascension: 0, stats: { atk: 10, def: 20, units: 3, power: 40 }, shardsOwned: 5, skillLevels: [2, 1, 1] }],
                    buildings: [{ buildingId: "b_hq", buildingType: "hq", slotCode: "center", level: 3, state: "IDLE", endAtMs: 0, taskId: "" }],
                    alliances: { allianceId: "", name: "", tag: "" },
                    pass: { seasonId: "season_1", claimed: {} },
                    expedition: { active: { expeditionId: "exp_keep_me", destinationId: "grey-forest", endsAtMs: 987654321 } },
                    claimedExpeditionIds: ["exp_already_claimed"],
                    featureFlags: { tutorialCompleted: true }
                  }
                }
              },
              receipts: {},
              alliances: {}
            };
            await writeDb(state);
            const loaded = await readDb();
            const user = loaded.users[externalId];
            assert.ok(user, "player row should exist");
            assert.equal(user.v1.expedition.active.expeditionId, "exp_keep_me");
            assert.deepEqual(user.v1.claimedExpeditionIds, ["exp_already_claimed"]);
            assert.equal(user.v1.featureFlags.tutorialCompleted, true);
            assert.equal(user.v1.resources.gold, 123);
            assert.equal(user.v1.heroes[0].heroId, "lucas");
            assert.equal(user.v1.buildings[0].slotCode, "center");
            assert.equal(user.inventory.potion_small, 3);
            console.log("Player state round-trip verified, including fields not yet normalized.");
          } finally {
            await closeRepository();
          }
          NODE
        working-directory: backend
        env:
          NODE_ENV: test
          DATA_DRIVER: postgres
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_DATABASE: infinitwar_test
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_SSL: "false"

      - name: Verify PostgreSQL writes are atomic across normalized tables and app_state
        run: node --test test/postgres-atomic-write.integration.test.js
        working-directory: backend
        env:
          NODE_ENV: test
          DATA_DRIVER: postgres
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_DATABASE: infinitwar_test
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_SSL: "false"

      - name: Verify PostgreSQL state mutation lock serializes concurrent requests
        run: node --test test/postgres-concurrent-write-lock.integration.test.js
        working-directory: backend
        env:
          NODE_ENV: test
          DATA_DRIVER: postgres
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_DATABASE: infinitwar_test
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_SSL: "false"

      - name: Run backend integration tests
        run: npm run test:integration
        working-directory: backend
