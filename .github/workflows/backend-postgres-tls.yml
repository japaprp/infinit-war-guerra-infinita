name: Backend PostgreSQL TLS checks

on:
  push:
    branches:
      - integration/postgres-ssl
  pull_request:
    branches:
      - main
      - integration/postgres-ssl

permissions:
  contents: read

jobs:
  postgres-tls:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate PostgreSQL TLS certificate handling
        run: npm run test:postgres-tls
