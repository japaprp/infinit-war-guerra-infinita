name: PostgreSQL connection and isolated repository validation

on:
  push:
    branches:
      - integration/postgres-auth-isolated
    paths:
      - ".github/workflows/postgres-connection-check.yml"
      - "backend/scripts/check-postgres-connection.mjs"
      - "backend/scripts/check-postgres-repository-integration.mjs"
      - "backend/src/repositories/dbRepository.js"
      - "backend/src/postgresCompat.js"
      - "backend/test/postgres-connection-check.test.js"
      - "backend/package.json"
      - "backend/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/postgres-auth-isolated
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Check validation script syntax
        run: |
          node --check scripts/check-postgres-connection.mjs
          node --check scripts/check-postgres-repository-integration.mjs
        working-directory: backend
      - name: Run PostgreSQL connection-check unit tests
        run: node --test test/postgres-connection-check.test.js
        working-directory: backend
      - name: Verify TLS, schema presence, and temporary transaction persistence
        run: node scripts/check-postgres-connection.mjs
        working-directory: backend
        env:
          GAME_SUPABASE_DATABASE_URL: ${{ secrets.GAME_SUPABASE_DATABASE_URL }}
          GAME_SUPABASE_CA_CERT: ${{ secrets.GAME_SUPABASE_CA_CERT }}
      - name: Verify repository round-trip, rollback, concurrency, and pool recovery in a temporary schema
        run: node scripts/check-postgres-repository-integration.mjs
        working-directory: backend
        env:
          GAME_SUPABASE_DATABASE_URL: ${{ secrets.GAME_SUPABASE_DATABASE_URL }}
          GAME_SUPABASE_CA_CERT: ${{ secrets.GAME_SUPABASE_CA_CERT }}
