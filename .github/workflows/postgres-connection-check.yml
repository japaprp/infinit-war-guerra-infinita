name: PostgreSQL connection check

on:
  push:
    branches:
      - integration/postgres-auth-isolated
      - fix/postgres-render-runtime-config
    paths:
      - ".github/workflows/postgres-connection-check.yml"
      - "backend/scripts/check-postgres-connection.mjs"
      - "backend/test/postgres-connection-check.test.js"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/src/config/env.js"
      - "backend/src/postgresCompat.js"
      - "backend/test/deployment-config.test.js"
      - "render.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Check script syntax
        run: node --check scripts/check-postgres-connection.mjs
        working-directory: backend
      - name: Run PostgreSQL connection-check unit tests
        run: node --test test/postgres-connection-check.test.js
        working-directory: backend
      - name: Run read-only PostgreSQL connection check
        run: node scripts/check-postgres-connection.mjs
        working-directory: backend
        env:
          GAME_SUPABASE_DATABASE_URL: ${{ secrets.GAME_SUPABASE_DATABASE_URL }}
          GAME_SUPABASE_CA_CERT: ${{ secrets.GAME_SUPABASE_CA_CERT }}
