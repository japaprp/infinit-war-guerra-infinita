name: Android APK (debug)

on:
  push:
    branches:
      - feat/integrate-hero-recruit-asset
    paths:
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.json'
      - 'scripts/prepare-android-web.mjs'
      - 'index.html'
      - 'game.html'
      - 'main.js'
      - 'style.css'
      - 'sytle.css'
      - 'api/**'
      - 'auth/**'
      - 'assets/**'
      - 'engine/**'
      - 'entities/**'
      - 'scenes/**'
      - 'systems/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor tooling
        run: npm install --no-save --package-lock=false --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare web assets
        run: node scripts/prepare-android-web.mjs

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guerra-infinita-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
