name: Client Persistence

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
    paths:
      - "tests/client-persistence.test.mjs"
      - "tests/client-backend-recovery.test.mjs"
      - "tests/public-frontend-package.test.mjs"
      - "frontend/public/**"
      - "backend/**"
      - "api/**"
      - "auth/**"
      - "index.html"
      - "main.js"
      - "game.html"
      - "package.json"
      - ".github/workflows/client-persistence.yml"
  pull_request:
    paths:
      - "tests/client-persistence.test.mjs"
      - "tests/client-backend-recovery.test.mjs"
      - "backend/**"
      - "api/**"
      - "auth/**"
      - "index.html"
      - "main.js"
      - "game.html"
      - "package.json"
      - ".github/workflows/client-persistence.yml"
  workflow_dispatch:

concurrency:
  group: \${{ github.workflow }}-\${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  browser-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate public frontend package allowlist and source parity
        run: node --test tests/public-frontend-package.test.mjs

      - name: Install backend runtime dependencies
        run: npm --prefix backend install --no-package-lock --omit=dev

      - name: Install free Playwright test dependency
        run: npm install --no-save --no-package-lock --omit=dev playwright@1.55.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run real-browser persistence and backend recovery tests
        run: node --test tests/client-persistence.test.mjs tests/client-backend-recovery.test.mjs
