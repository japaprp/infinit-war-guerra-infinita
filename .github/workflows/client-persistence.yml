name: Client Persistence

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  browser-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install free Playwright test dependency
        run: npm install --no-save --no-package-lock --omit=dev playwright@1.55.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run real-browser persistence test
        run: node --test tests/client-persistence.test.mjs
