name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/backend-integration.yml"
      - "api/**"
      - "auth/**"
      - "index.html"
      - "game.html"
      - "render.yaml"
      - "DEPLOYMENT_PREPARATION.md"
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/backend-integration.yml"
      - "api/**"
      - "auth/**"
      - "index.html"
      - "game.html"
      - "render.yaml"
      - "DEPLOYMENT_PREPARATION.md"
  workflow_dispatch:

concurrency:
  group: \${{ github.workflow }}-\${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test deployment readiness and configuration
        run: npm run test:deploy
