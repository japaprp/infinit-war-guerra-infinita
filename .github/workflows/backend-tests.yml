name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
      - "api/**"
      - "auth/**"
      - "engine/**"
      - "entities/**"
      - "frontend/public/**"
      - "tests/public-frontend-package.test.mjs"
      - "index.html"
      - "game.html"
      - "main.js"
      - "style.css"
      - "render.yaml"
      - "DEPLOYMENT_PREPARATION.md"
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
      - "api/**"
      - "auth/**"
      - "engine/**"
      - "entities/**"
      - "frontend/public/**"
      - "tests/public-frontend-package.test.mjs"
      - "index.html"
      - "game.html"
      - "main.js"
      - "style.css"
      - "render.yaml"
      - "DEPLOYMENT_PREPARATION.md"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test public frontend package boundary
        run: node --test ../tests/public-frontend-package.test.mjs
      - name: Test deployment readiness and configuration
        run: npm run test:deploy
      - name: Test backend integration
        run: npm run test:integration
