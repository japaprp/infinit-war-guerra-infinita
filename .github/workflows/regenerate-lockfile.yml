name: Regenerate backend lockfile

on:
  push:
    branches:
      - fix/postgres-supabase-migration
    paths:
      - "backend/package.json"
      - ".github/workflows/regenerate-lockfile.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: fix/postgres-supabase-migration
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Regenerate lockfile from package.json
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate lockfile consistency
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Commit updated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
          else
            git commit -m "fix: regenerate PostgreSQL backend lockfile"
            git push origin HEAD:fix/postgres-supabase-migration
          fi
