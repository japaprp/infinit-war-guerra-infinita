services:
  - type: web
    name: infinit-war-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DRIVER
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RECEIPT_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        value: guerra-infinita-dd9dd
      - key: CORS_ORIGINS
        sync: false
